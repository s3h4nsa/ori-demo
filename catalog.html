<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Catalog Console</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    --bg: #ffffff; --bg-soft: #f6f6f7;
    --surface: #ffffff; --surface-solid: #ffffff;
    --border: rgba(17, 17, 19, 0.10); --border-strong: rgba(17, 17, 19, 0.28);
    --teal: #141416; --teal-dim: rgba(17, 17, 19, 0.06);
    --violet: #4b4b50; --violet-dim: rgba(17, 17, 19, 0.05);
    --amber: #6b6b70; --amber-dim: rgba(17,17,19,0.05);
    --text: #141416; --text-muted: #75757b; --danger: #b3261e;
    --shadow: 0 1px 2px rgba(17,17,19,0.04);
    --shadow-hover: 0 12px 28px rgba(17,17,19,0.10);
    --radius: 14px;
    font-family: 'Space Grotesk', sans-serif;
    background: var(--bg);
    color: var(--text); min-height: 100vh; padding: 28px 20px 60px;
  }
  body.dark {
    --bg: #101012; --bg-soft: #1a1a1d;
    --surface: #17171a; --surface-solid: #17171a;
    --border: rgba(255,255,255,0.10); --border-strong: rgba(255,255,255,0.24);
    --teal: #f2f2f3; --teal-dim: rgba(255,255,255,0.08);
    --violet: #c9c9ce; --violet-dim: rgba(255,255,255,0.06);
    --amber: #b8b8be; --amber-dim: rgba(255,255,255,0.06);
    --text: #f2f2f3; --text-muted: #9a9aa0; --danger: #ff6b61;
    --shadow: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-hover: 0 12px 28px rgba(0,0,0,0.45);
  }
  body, body *:not(input):not(textarea) { -webkit-tap-highlight-color: transparent; }
  .cc-mono { font-family: 'JetBrains Mono', monospace; }
  button, input, select, textarea, .cc-card {
    transition: background-color .18s ease, border-color .18s ease, color .18s ease,
                box-shadow .18s ease, transform .18s ease, opacity .18s ease, filter .18s ease;
  }
  @keyframes cc-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes cc-pop { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
  @keyframes cc-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .cc-shell { max-width: 1280px; margin: 0 auto; }

  .cc-topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
  .cc-brand { display: flex; align-items: center; gap: 12px; }
  .cc-brand-mark {
    width: 38px; height: 38px; border-radius: 10px;
    background: linear-gradient(135deg, #1c1c1f, #3a3a40);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #ffffff; font-size: 15px; flex-shrink: 0;
  }
  .cc-brand h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .cc-brand p { margin: 2px 0 0; font-size: 12.5px; color: var(--text-muted); }

  .cc-topbar-right { display: flex; align-items: center; gap: 12px; }

  .cc-theme-toggle {
    width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-muted); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
  }
  .cc-theme-toggle:hover { color: var(--text); border-color: var(--border-strong); }

  .cc-tabs { display: flex; gap: 8px; }
  .cc-tab {
    padding: 9px 18px; border-radius: 999px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text-muted);
  }
  .cc-tab:hover { color: var(--text); border-color: var(--border-strong); }
  .cc-tab.active { color: #fff; background: var(--teal); border-color: var(--teal); }
  body.dark .cc-tab.active { color: #101012; }

  .cc-toolbar { display: flex; align-items: center; gap: 10px; margin: 20px 0 18px; flex-wrap: wrap; }
  .cc-toolbar .cc-spacer { flex: 1; }
  .cc-search {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 12px; font-size: 13px; color: var(--text); min-width: 200px; flex: 1; max-width: 320px;
    font-family: inherit;
  }
  .cc-select {
    background: var(--bg-soft); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 10px; font-size: 13px; color: var(--text-muted); font-family: inherit;
  }
  .cc-count { font-size: 12px; color: var(--text-muted); }
  .cc-search:focus, .cc-select:focus { border-color: var(--border-strong); outline: none; }
  .cc-btn {
    border: none; border-radius: 9px; padding: 10px 16px; font-family: inherit;
    font-size: 13.5px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    background: var(--teal); color: #fff; white-space: nowrap;
  }
  body.dark .cc-btn { color: #101012; }
  .cc-btn:hover:not(:disabled) { filter: brightness(0.85); transform: translateY(-1px); box-shadow: var(--shadow-hover); }
  .cc-btn:active:not(:disabled) { transform: translateY(0); }
  .cc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .cc-btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--text-muted); }
  body.dark .cc-btn.ghost { color: var(--text-muted); }
  .cc-btn.ghost:hover { color: var(--text); border-color: var(--border-strong); background: var(--bg-soft); box-shadow: none; transform: none; }
  .cc-btn.small { padding: 7px 12px; font-size: 12.5px; }

  .cc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); gap: 14px; }

  .cc-card {
    border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border);
    background: var(--surface-solid); display: flex; flex-direction: column;
    box-shadow: var(--shadow); animation: cc-rise .25s ease both;
  }
  .cc-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); border-color: var(--border-strong); }
  .cc-card-media { height: 140px; background: var(--bg-soft); position: relative; overflow: hidden; }
  .cc-card-media img { transition: transform .35s ease; width: 100%; height: 100%; object-fit: cover; }
  .cc-card:hover .cc-card-media img { transform: scale(1.04); }
  .cc-card-media .cc-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 12px; }
  .cc-badge {
    position: absolute; top: 8px; right: 8px; font-size: 10px; padding: 3px 8px; border-radius: 6px;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(6px); color: var(--text-muted); border: 1px solid var(--border);
  }
  body.dark .cc-badge { background: rgba(23,23,26,0.85); }
  .cc-badge.active { color: var(--text); border-color: var(--border-strong); font-weight: 600; }
  .cc-badge.out_of_stock { color: var(--danger); border-color: rgba(179,38,30,0.3); }
  .cc-badge.draft { color: var(--text-muted); }

  .cc-card-body { padding: 12px 13px 13px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .cc-card-tag { align-self: flex-start; font-size: 10.5px; color: var(--violet); background: var(--violet-dim); padding: 3px 8px; border-radius: 6px; }
  .cc-card-name { font-size: 14px; font-weight: 600; margin: 0; line-height: 1.3; }
  .cc-card-desc { font-size: 11.5px; color: var(--text-muted); margin: 0; line-height: 1.5; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .cc-card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
  .cc-price { font-size: 14px; font-weight: 700; color: var(--teal); }
  .cc-stock { font-size: 10.5px; color: var(--text-muted); }
  .cc-sku { font-size: 10px; color: var(--text-muted); }
  .cc-card-actions { display: flex; gap: 6px; margin-top: 8px; }
  .cc-icon-btn {
    flex: 1; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-muted);
    border-radius: 7px; padding: 6px; font-size: 11.5px; cursor: pointer; font-family: inherit;
  }
  .cc-icon-btn:hover { color: var(--text); border-color: var(--border-strong); background: var(--surface); box-shadow: var(--shadow); }
  .cc-icon-btn.danger:hover { color: var(--danger); border-color: rgba(179,38,30,0.35); }

  .cc-empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .cc-empty-state h3 { color: var(--text); font-size: 15px; margin: 0 0 6px; }
  .cc-empty-state p { font-size: 13px; margin: 0 0 16px; }
  .cc-config-note {
    background: var(--bg-soft); border: 1px dashed var(--border-strong); border-radius: var(--radius);
    padding: 18px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6;
  }
  .cc-config-note code { color: var(--text); background: var(--surface); border: 1px solid var(--border); padding: 1px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }

  .cc-modal-overlay {
    position: fixed; inset: 0; background: rgba(20,20,22,0.35); backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px;
    animation: cc-fade .18s ease;
  }
  body.dark .cc-modal-overlay { background: rgba(0,0,0,0.55); }
  .cc-modal {
    background: var(--surface-solid); border: 1px solid var(--border); border-radius: var(--radius);
    width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto; padding: 22px;
    box-shadow: 0 24px 60px rgba(17,17,19,0.18);
    animation: cc-pop .22s cubic-bezier(.16,1,.3,1);
  }
  .cc-modal h2 { font-size: 16px; margin: 0 0 16px; }
  .cc-field { margin-bottom: 12px; }
  .cc-field label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 6px; }
  .cc-field input, .cc-field textarea, .cc-field select {
    width: 100%; background: var(--bg-soft); border: 1px solid var(--border); color: var(--text);
    border-radius: 9px; padding: 9px 11px; font-family: inherit; font-size: 13.5px; outline: none;
  }
  .cc-field input:focus, .cc-field textarea:focus, .cc-field select:focus { border-color: var(--teal); }
  .cc-field textarea { resize: vertical; min-height: 64px; }
  .cc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cc-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  .cc-toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1c1c1f; border: 1px solid rgba(255,255,255,0.08);
    padding: 11px 18px; border-radius: 10px; font-size: 13px; color: #fff;
    box-shadow: 0 12px 30px rgba(17,17,19,0.28); z-index: 70;
    animation: cc-pop .2s cubic-bezier(.16,1,.3,1);
  }
  .cc-toast.error { border-color: rgba(179,38,30,0.5); }
</style>
</head>
<body>

<div id="root"></div>

<script>
// ---------------------------------------------------------------------------
// Catalog Console — uses the same API and table field names as the storefront.
// The server maps these routes to the configured database (SQLite or Supabase).
const API_BASE = "/api";
const CONFIGURED = true;
const HEADERS = { "Content-Type": "application/json" };

const emptyCategory = { name: "", slug: "", description: "", image_url: "" };
const emptyProduct = {
  name: "", sku: "", category_id: "", price: "", stock: "",
  description: "", image_url: "", status: "active",
};

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
}
function currency(n) {
  const v = Number(n);
  if (Number.isNaN(v)) return "$0.00";
  return v.toLocaleString(undefined, { style: "currency", currency: "USD" });
}
function esc(str) {
  const d = document.createElement("div");
  d.textContent = str == null ? "" : String(str);
  return d.innerHTML;
}
const STATUS_LABEL = { active: "Active", draft: "Draft", out_of_stock: "Out of stock" };

// ---- theme --------------------------------------------------------------
function getStoredTheme() {
  try { return localStorage.getItem("cc-theme"); } catch (e) { return null; }
}
function setStoredTheme(v) {
  try { localStorage.setItem("cc-theme", v); } catch (e) {}
}
function applyTheme(theme) {
  document.body.classList.toggle("dark", theme === "dark");
  const btn = document.getElementById("theme-toggle-btn");
  if (btn) btn.textContent = theme === "dark" ? "☀️" : "🌙";
}
function toggleTheme() {
  const next = document.body.classList.contains("dark") ? "light" : "dark";
  applyTheme(next);
  setStoredTheme(next);
}

// ---- state ----------------------------------------------------------------
const state = {
  view: "products",
  categories: [],
  products: [],
  loading: true,
  busy: false,
  toast: null,
  productModal: null,   // { mode, data }
  categoryModal: null,  // { mode, data }
  slugTouched: false,
  filters: { search: "", category: "", status: "", sort: "newest" },
  categorySearch: "",
};
let toastTimer = null;

function showToast(type, message) {
  state.toast = { type, message };
  renderToast();
  window.clearTimeout(toastTimer);
  toastTimer = window.setTimeout(() => { state.toast = null; renderToast(); }, 3200);
}

async function loadAll() {
  state.loading = true; render();
  try {
    const [catRes, prodRes] = await Promise.all([
      fetch(API_BASE + "/categories", { headers: HEADERS }),
      fetch(API_BASE + "/products", { headers: HEADERS }),
    ]);
    if (!catRes.ok) throw new Error(await catRes.text());
    if (!prodRes.ok) throw new Error(await prodRes.text());
    state.categories = await catRes.json();
    state.products = (await prodRes.json()).map((product) => {
      const category = state.categories.find((item) =>
        String(item.name).toLowerCase() === String(product.cat || "").toLowerCase()
      );
      const status = String(product.status || "Active").toLowerCase().replace(/\s+/g, "_");
      return Object.assign({}, product, {
        sku: product.sku || product.slug || "",
        category_id: category ? category.id : "",
        status: status === "out_of_stock" ? "out_of_stock" : status,
        image_url: product.image || product.image_url || "",
        description: product.description || product.desc || "",
      });
    });
  } catch (e) {
    console.error(e);
    showToast("error", "Couldn't load the catalog. Make sure the store server is running.");
  } finally {
    state.loading = false; render();
  }
}

function categoryById(id) { return state.categories.find((c) => c.id === id); }

function getFilteredProducts() {
  let list = [...state.products];
  const q = state.filters.search.trim().toLowerCase();
  if (q) list = list.filter((p) => p.name.toLowerCase().includes(q) || (p.sku || "").toLowerCase().includes(q));
  if (state.filters.category) list = list.filter((p) => p.category_id === state.filters.category);
  if (state.filters.status) list = list.filter((p) => p.status === state.filters.status);
  switch (state.filters.sort) {
    case "name": list.sort((a, b) => a.name.localeCompare(b.name)); break;
    case "price_asc": list.sort((a, b) => a.price - b.price); break;
    case "price_desc": list.sort((a, b) => b.price - a.price); break;
    case "stock_low": list.sort((a, b) => a.stock - b.stock); break;
    default: break; // newest — already ordered by created_at desc
  }
  return list;
}
function getFilteredCategories() {
  const q = state.categorySearch.trim().toLowerCase();
  if (!q) return state.categories;
  return state.categories.filter((c) => c.name.toLowerCase().includes(q));
}

// ---- product CRUD -----------------------------------------------------
function openAddProduct() { state.productModal = { mode: "add", data: Object.assign({}, emptyProduct) }; render(); }
function openEditProduct(id) {
  const p = state.products.find((x) => x.id === id);
  state.productModal = { mode: "edit", data: Object.assign({}, p, { price: String(p.price), stock: String(p.stock) }) };
  render();
}
async function submitProduct(e) {
  e.preventDefault();
  const data = state.productModal.data;
  if (!data.name.trim() || !data.sku.trim()) return showToast("error", "Product needs a name and SKU.");
  state.busy = true; setModalBusy(true);
  try {
    const payload = {
      id: data.id, slug: data.sku || slugify(data.name), name: data.name,
      cat: (categoryById(data.category_id) || {}).name || "",
      price: Number(data.price) || 0, stock: Number(data.stock) || 0,
      description: data.description, image: data.image_url,
      status: data.status === "out_of_stock" ? "Out of stock" : data.status === "draft" ? "Draft" : "Active",
    };
    const url = state.productModal.mode === "edit"
      ? API_BASE + "/products/" + encodeURIComponent(data.id)
      : API_BASE + "/products";
    const res = await fetch(url, {
      method: state.productModal.mode === "edit" ? "PUT" : "POST",
      headers: HEADERS, body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    showToast("ok", 'Saved "' + payload.name + '".');
    state.productModal = null;
    state.busy = false;
    render();
    await loadAll();
  } catch (err) {
    console.error(err);
    showToast("error", "Couldn't save that product.");
    state.busy = false; setModalBusy(false);
  }
}
async function deleteProduct(id) {
  const p = state.products.find((x) => x.id === id);
  if (!window.confirm('Remove "' + p.name + '"?')) return;
  try {
    const res = await fetch(API_BASE + "/products/" + encodeURIComponent(id), { method: "DELETE", headers: HEADERS });
    if (!res.ok) throw new Error(await res.text());
    showToast("ok", 'Removed "' + p.name + '".');
    await loadAll();
  } catch (err) {
    showToast("error", "Couldn't remove that product.");
  }
}

// ---- category CRUD -------------------------------------------------
function openAddCategory() { state.slugTouched = false; state.categoryModal = { mode: "add", data: Object.assign({}, emptyCategory) }; render(); }
function openEditCategory(id) {
  const c = state.categories.find((x) => x.id === id);
  state.slugTouched = true;
  state.categoryModal = { mode: "edit", data: Object.assign({}, c) };
  render();
}
async function submitCategory(e) {
  e.preventDefault();
  const data = state.categoryModal.data;
  if (!data.name.trim()) return showToast("error", "Category needs a name.");
  state.busy = true; setModalBusy(true);
  try {
    const payload = {
      name: data.name, slug: data.slug || slugify(data.name),
      description: data.description,
    };
    const url = state.categoryModal.mode === "edit"
      ? API_BASE + "/categories/" + encodeURIComponent(data.id)
      : API_BASE + "/categories";
    const res = await fetch(url, {
      method: state.categoryModal.mode === "edit" ? "PUT" : "POST",
      headers: HEADERS, body: JSON.stringify(payload),
    });
    if (!res.ok) throw new Error(await res.text());
    showToast("ok", 'Saved "' + payload.name + '".');
    state.categoryModal = null;
    state.busy = false;
    render();
    await loadAll();
  } catch (err) {
    console.error(err);
    showToast("error", "Couldn't save that category.");
    state.busy = false; setModalBusy(false);
  }
}
async function deleteCategory(id) {
  const c = state.categories.find((x) => x.id === id);
  if (!window.confirm('Remove category "' + c.name + '"? Products in it become uncategorized.')) return;
  try {
    const res = await fetch(API_BASE + "/categories/" + encodeURIComponent(id), { method: "DELETE", headers: HEADERS });
    if (!res.ok) throw new Error(await res.text());
    showToast("ok", 'Removed "' + c.name + '".');
    await loadAll();
  } catch (err) {
    showToast("error", "Couldn't remove that category.");
  }
}

function setModalBusy(busy) {
  document.querySelectorAll(".cc-modal button[type=submit]").forEach((b) => {
    b.disabled = busy;
    if (b.dataset.label) b.textContent = busy ? b.dataset.busyLabel : b.dataset.label;
  });
}

// ---- render -----------------------------------------------------------
// Full render: rebuilds the shell + view + modals. Called on load, view
// switch, dropdown/filter changes, and modal open/close — NOT on every
// keystroke inside a text field (that would steal focus / cause flicker).
function render() {
  const root = document.getElementById("root");
  const activeFilterCount = [state.filters.search, state.filters.category, state.filters.status].filter(Boolean).length;

  root.innerHTML = ""
    + '<div class="cc-shell">'
    +   '<div class="cc-topbar">'
    +     '<div class="cc-brand">'
    +       '<div class="cc-brand-mark">CC</div>'
    +       '<div>'
    +         '<h1>Catalog Console</h1>'
    +         '<p>' + state.products.length + ' products · ' + state.categories.length + ' categories</p>'
    +       '</div>'
    +     '</div>'
    +     '<div class="cc-topbar-right">'
    +       '<div class="cc-tabs">'
    +         '<div class="cc-tab ' + (state.view === "products" ? "active" : "") + '" data-action="set-view" data-view="products">Products</div>'
    +         '<div class="cc-tab ' + (state.view === "categories" ? "active" : "") + '" data-action="set-view" data-view="categories">Categories</div>'
    +       '</div>'
    +       '<button class="cc-theme-toggle" id="theme-toggle-btn" data-action="toggle-theme" title="Toggle dark mode">🌙</button>'
    +     '</div>'
    +   '</div>'

    + '<div id="view-container">' + (state.view === "products" ? renderProductsView(activeFilterCount) : renderCategoriesView()) + '</div>'
    + '</div>'

    + '<div id="modal-container">' + (state.productModal ? renderProductModal() : "") + (state.categoryModal ? renderCategoryModal() : "") + '</div>'
    + '<div id="toast-container">' + renderToastHtml() + '</div>';

  applyTheme(getStoredTheme() === "dark" ? "dark" : "light");
  attachHandlers();
}

// Toast can update without touching anything else (no focus concerns there)
function renderToastHtml() {
  return state.toast ? '<div class="cc-toast ' + (state.toast.type === "error" ? "error" : "") + '">' + esc(state.toast.message) + '</div>' : "";
}
function renderToast() {
  const el = document.getElementById("toast-container");
  if (el) el.innerHTML = renderToastHtml();
}

// Re-render just the products grid area (search/filter typing) without
// touching the toolbar inputs themselves, so focus/cursor stay put.
function renderProductsGridOnly() {
  const wrap = document.getElementById("products-grid-wrap");
  const countEl = document.getElementById("products-count");
  if (!wrap) return;
  const list = getFilteredProducts();
  if (countEl) countEl.textContent = list.length + " shown";
  wrap.innerHTML = buildProductsGridHtml(list);
  attachCardHandlers();
}
function renderCategoriesGridOnly() {
  const wrap = document.getElementById("categories-grid-wrap");
  const countEl = document.getElementById("categories-count");
  if (!wrap) return;
  const list = getFilteredCategories();
  if (countEl) countEl.textContent = list.length + " shown";
  wrap.innerHTML = buildCategoriesGridHtml(list);
  attachCardHandlers();
}

function buildProductsGridHtml(list) {
  if (state.loading) return '<div class="cc-empty-state"><p>Loading…</p></div>';
  if (list.length === 0) {
    return '<div class="cc-empty-state">'
      + '<h3>No products match</h3>'
      + '<p>' + (state.products.length === 0 ? "Add your first product to get started." : "Try adjusting the filters.") + '</p>'
      + (CONFIGURED ? '<button class="cc-btn" data-action="add-product">+ Add product</button>' : '')
      + '</div>';
  }
  return '<div class="cc-grid">' + list.map((p) => {
    const cat = categoryById(p.category_id);
    return ''
      + '<div class="cc-card">'
      +   '<div class="cc-card-media">'
      +     (p.image_url ? '<img src="' + esc(p.image_url) + '" alt="" onerror="this.style.display=\'none\'" />' : '<span class="cc-ph">No image</span>')
      +     '<span class="cc-badge ' + p.status + '">' + (STATUS_LABEL[p.status] || esc(p.status)) + '</span>'
      +   '</div>'
      +   '<div class="cc-card-body">'
      +     (cat ? '<span class="cc-card-tag">' + esc(cat.name) + '</span>' : '')
      +     '<p class="cc-card-name">' + esc(p.name) + '</p>'
      +     '<p class="cc-card-desc">' + esc(p.description || "No description.") + '</p>'
      +     '<div class="cc-card-foot">'
      +       '<span class="cc-price">' + currency(p.price) + '</span>'
      +       '<span class="cc-stock">' + p.stock + ' in stock</span>'
      +     '</div>'
      +     '<span class="cc-sku cc-mono">' + esc(p.sku) + '</span>'
      +     '<div class="cc-card-actions">'
      +       '<button class="cc-icon-btn" data-action="edit-product" data-id="' + p.id + '">Edit</button>'
      +       '<button class="cc-icon-btn danger" data-action="delete-product" data-id="' + p.id + '">Delete</button>'
      +     '</div>'
      +   '</div>'
      + '</div>';
  }).join("") + '</div>';
}

function buildCategoriesGridHtml(list) {
  if (state.loading) return '<div class="cc-empty-state"><p>Loading…</p></div>';
  if (list.length === 0) {
    return '<div class="cc-empty-state">'
      + '<h3>No categories match</h3>'
      + '<p>' + (state.categories.length === 0 ? "Add your first category to get started." : "Try a different search.") + '</p>'
      + (CONFIGURED ? '<button class="cc-btn" data-action="add-category">+ Add category</button>' : '')
      + '</div>';
  }
  return '<div class="cc-grid">' + list.map((c) => ''
    + '<div class="cc-card">'
    +   '<div class="cc-card-media">'
    +     (c.image_url ? '<img src="' + esc(c.image_url) + '" alt="" onerror="this.style.display=\'none\'" />' : '<span class="cc-ph">No image</span>')
    +   '</div>'
    +   '<div class="cc-card-body">'
    +     '<p class="cc-card-name">' + esc(c.name) + '</p>'
    +     '<p class="cc-card-desc">' + esc(c.description || "No description.") + '</p>'
    +     '<span class="cc-sku cc-mono">/' + esc(c.slug) + '</span>'
    +     '<div class="cc-card-actions">'
    +       '<button class="cc-icon-btn" data-action="edit-category" data-id="' + c.id + '">Edit</button>'
    +       '<button class="cc-icon-btn danger" data-action="delete-category" data-id="' + c.id + '">Delete</button>'
    +     '</div>'
    +   '</div>'
    + '</div>').join("") + '</div>';
}

function renderProductsView(activeFilterCount) {

    + '<div class="cc-toolbar">'

    +     '<option value="draft" ' + (state.filters.status === "draft" ? "selected" : "") + '>Draft</option>'
    +     '<option value="out_of_stock" ' + (state.filters.status === "out_of_stock" ? "selected" : "") + '>Out of stock</option>'

    +     '<option value="price_asc" ' + (state.filters.sort === "price_asc" ? "selected" : "") + '>Price: low to high</option>'
    +     '<option value="price_desc" ' + (state.filters.sort === "price_desc" ? "selected" : "") + '>Price: high to low</option>'
    +     '<option value="stock_low" ' + (state.filters.sort === "stock_low" ? "selected" : "") + '>Stock: low first</option>'

function renderCategoriesView() {

    +       '</select></div>'

    +         '<option value="draft" ' + (d.status === "draft" ? "selected" : "") + '>Draft</option>'

    +       '</select></div>'
    +     '</div>'
    +     '<div class="cc-row2">'

    +       '<div class="cc-field"><label>Stock</label><input class="cc-mono" type="number" min="0" id="p-stock" value="' + esc(d.stock) + '" placeholder="0" /></div>'

function renderCategoryModal() {

    + '<div class="cc-modal-overlay" data-action="close-category-overlay">'

    +       '<button type="submit" class="cc-btn" data-label="Save category" data-busy-label="Saving…" ' + (state.busy ? "disabled" : "") + '>' + (state.busy ? "Saving…" : "Save category") + '</button>'
    +     '</div>'

// ---- event wiring ---------------------------------------------------------
// attachHandlers is called after a FULL render(); it wires the shell,
// toolbar, and modal fields. Text inputs update `state` directly on
// "input" without calling render(), so the DOM (and focus/caret) is left
// alone while typing — only the grid or a specific derived field updates.
function attachHandlers() {
  attachCardHandlers();

  document.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.dataset.action;
    if (el.dataset.bound) return;
    el.dataset.bound = "1";
    el.addEventListener("click", (e) => {
      if (action === "set-view") { state.view = el.dataset.view; render(); }
      else if (action === "toggle-theme") { toggleTheme(); }
      else if (action === "clear-filters") { state.filters = { search: "", category: "", status: "", sort: state.filters.sort }; render(); }
      else if (action === "add-product") openAddProduct();
      else if (action === "add-category") openAddCategory();
      else if (action === "close-product") { state.productModal = null; render(); }
      else if (action === "close-category") { state.categoryModal = null; render(); }
      else if (action === "close-product-overlay") { if (e.target === el) { state.productModal = null; render(); } }
      else if (action === "close-category-overlay") { if (e.target === el) { state.categoryModal = null; render(); } }
    });
  });

  // filters — search boxes update state + only the grid, no full render
  const fSearch = document.getElementById("f-search");
  if (fSearch) fSearch.addEventListener("input", (e) => { state.filters.search = e.target.value; renderProductsGridOnly(); });
  const fCategory = document.getElementById("f-category");
  if (fCategory) fCategory.addEventListener("change", (e) => { state.filters.category = e.target.value; render(); });
  const fStatus = document.getElementById("f-status");
  if (fStatus) fStatus.addEventListener("change", (e) => { state.filters.status = e.target.value; render(); });
  const fSort = document.getElementById("f-sort");
  if (fSort) fSort.addEventListener("change", (e) => { state.filters.sort = e.target.value; render(); });
  const fCatSearch = document.getElementById("f-category-search");
  if (fCatSearch) fCatSearch.addEventListener("input", (e) => { state.categorySearch = e.target.value; renderCategoriesGridOnly(); });

  // product modal — plain state updates, no re-render per keystroke
  const pForm = document.getElementById("product-form");
  if (pForm) {
    pForm.addEventListener("submit", submitProduct);
    silentBind("p-name", (v) => state.productModal.data.name = v);
    silentBind("p-sku", (v) => state.productModal.data.sku = v);
    const pCat = document.getElementById("p-category");
    if (pCat) pCat.addEventListener("change", (e) => state.productModal.data.category_id = e.target.value);
    const pStatus = document.getElementById("p-status");
    if (pStatus) pStatus.addEventListener("change", (e) => state.productModal.data.status = e.target.value);
    silentBind("p-price", (v) => state.productModal.data.price = v);
    silentBind("p-stock", (v) => state.productModal.data.stock = v);
    silentBind("p-description", (v) => state.productModal.data.description = v);
    silentBind("p-image", (v) => state.productModal.data.image_url = v);
  }

  // category modal
  const cForm = document.getElementById("category-form");
  if (cForm) {
    cForm.addEventListener("submit", submitCategory);
    const nameInput = document.getElementById("c-name");
    if (nameInput) nameInput.addEventListener("input", (e) => {
      const name = e.target.value;
      state.categoryModal.data.name = name;
      if (!state.slugTouched) {
        state.categoryModal.data.slug = slugify(name);
        const slugEl = document.getElementById("c-slug");
        if (slugEl) slugEl.value = state.categoryModal.data.slug;
      }
    });
    const slugInput = document.getElementById("c-slug");
    if (slugInput) slugInput.addEventListener("input", (e) => {
      state.slugTouched = true;
      state.categoryModal.data.slug = slugify(e.target.value);
    });
    silentBind("c-description", (v) => state.categoryModal.data.description = v);
  }
}

// re-attach click handlers for cards after a grid-only refresh (they don't
// have data-bound yet since they're freshly injected)
function attachCardHandlers() {
  document.querySelectorAll("[data-action]").forEach((el) => {
    const action = el.dataset.action;
    if (el.dataset.bound) return;
    if (!["edit-product", "delete-product", "edit-category", "delete-category", "add-product", "add-category"].includes(action)) return;
    el.dataset.bound = "1";
    el.addEventListener("click", () => {
      if (action === "edit-product") openEditProduct(el.dataset.id);
      else if (action === "delete-product") deleteProduct(el.dataset.id);
      else if (action === "edit-category") openEditCategory(el.dataset.id);
      else if (action === "delete-category") deleteCategory(el.dataset.id);
      else if (action === "add-product") openAddProduct();
      else if (action === "add-category") openAddCategory();
    });
  });
}

// binds an input's value to state without ever re-rendering the DOM
function silentBind(id, setter) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener("input", (e) => setter(e.target.value));
}

// ---- boot ---------------------------------------------------------------
applyTheme(getStoredTheme() === "dark" ? "dark" : "light");
render();
loadAll();
</script>
