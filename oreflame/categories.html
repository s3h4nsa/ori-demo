<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — Oriflame LK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#ffffff;
      --ink:#141b16;
      --muted:#8a938c;
      --line:#e9ebe6;
      --card:#f6f7f4;
      --green-a:#cdeaa4;
      --green-b:#9fcf78;
      --green-ink:#173b1f;
      --black:#141414;
      --radius-lg:26px;
      --radius-md:18px;
      --radius-sm:14px;
      --radius-full:999px;
      --maxw:1200px;
    }
    *{box-sizing:border-box; margin:0; padding:0;}
    html{scroll-behavior:smooth;}
    body{
      font-family:'Plus Jakarta Sans', system-ui, sans-serif;
      color:var(--ink);
      background:var(--bg);
      -webkit-font-smoothing:antialiased;
      padding-bottom:84px;
    }
    a{color:inherit; text-decoration:none;}
    button{font-family:inherit; cursor:pointer;}
    img{display:block; max-width:100%;}
    .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px;}

    .topnav{
      display:none;
      position:sticky; top:0; z-index:50;
      background:rgba(255,255,255,.9);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topnav .wrap{display:flex; align-items:center; justify-content:space-between; height:78px;}
    .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:20px; letter-spacing:-.02em;}
    .brand .dot{width:10px; height:10px; border-radius:50%; background:linear-gradient(135deg,var(--green-a),var(--green-b));}
    .brand-lk{
      font-size:10px; font-weight:800; background:var(--black); color:#fff;
      padding:2px 6px; border-radius:5px; margin-left:2px; letter-spacing:.03em;
    }
    .nav-links{display:flex; gap:34px; font-weight:600; font-size:14.5px; color:var(--ink);}
    .nav-links a{opacity:.7; transition:opacity .15s;}
    .nav-links a:hover, .nav-links a.active{opacity:1;}
    .nav-right{display:flex; align-items:center; gap:18px;}
    .icon-btn{
      width:42px; height:42px; border-radius:50%; border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center; background:#fff; position:relative;
    }
    .icon-btn svg{width:18px; height:18px;}
    .badge{
      position:absolute; top:-4px; right:-4px; background:var(--black); color:#fff;
      font-size:10px; font-weight:700; width:17px; height:17px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }

    .mobile-header{padding:22px 20px 4px;}
    .mobile-header .row{padding:0 0 0 0;}
    .mobile-header .row{display:flex; align-items:center; justify-content:space-between;}
    .mh-title{font-size:19px; font-weight:800; letter-spacing:-.02em;}
    .mh-action{
      width:44px; height:44px; border-radius:50%; border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center; background:#fff;
    }

    .page{
      width:calc(100% - 40px); max-width:var(--maxw); margin:0 auto; padding:18px 0 32px;
    }
    .page-head{padding:8px 0 20px;}
    .eyebrow{
      display:inline-flex; align-items:center; padding:7px 12px; border-radius:var(--radius-full);
      background:var(--card); border:1px solid var(--line); font-size:11px; font-weight:800;
      letter-spacing:.12em; text-transform:uppercase; color:var(--muted);
    }
    .page-head h1{margin-top:14px; font-size:clamp(30px,3vw,48px); letter-spacing:-.05em; line-height:1.05;}
    .page-head p{margin-top:10px; color:var(--muted); font-size:14px; line-height:1.6; max-width:640px;}

    .category-grid{
      display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; padding:10px 0 18px; align-items:stretch;
    }
    .category-card{
      width:100%; height:100%; border:1px solid var(--line); border-radius:var(--radius-lg); background:linear-gradient(135deg,#f8f9f7,#eef2ec);
      padding:18px 16px; text-align:left; min-height:150px; display:flex; flex-direction:column; justify-content:space-between; align-items:stretch;
      transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    }
    .category-card:hover{transform:translateY(-1px); border-color:#d7ddd3; box-shadow:0 10px 24px rgba(20,20,20,.04);}
    .category-card.active{background:var(--black); color:#fff; border-color:var(--black);}
    .category-card .label{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.7;}
    .category-card h3{font-size:22px; letter-spacing:-.04em; line-height:1.1; margin-top:10px;}
    .category-card .meta{font-size:12px; font-weight:700; opacity:.8;}

    .category-section{padding:14px 0 24px;}
    .category-head{
      display:flex; align-items:baseline; justify-content:space-between; gap:12px;
      margin-bottom:14px; padding-bottom:6px; border-bottom:1px solid var(--line);
    }
    .category-head h2{font-size:22px; letter-spacing:-.04em;}
    .category-head span{font-size:12.5px; color:var(--muted); font-weight:700;}

    .product-grid{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:14px; padding:0;}
    .card{
      background:var(--card); border-radius:20px; padding:14px; position:relative; display:flex; flex-direction:column;
    }
    .badge-tag{
      position:absolute; top:12px; left:12px; background:var(--black); color:#fff;
      font-size:9.5px; font-weight:700; letter-spacing:.03em; padding:5px 9px; border-radius:var(--radius-full);
      z-index:2;
    }
    .badge-tag.oos{background:#fff; color:var(--muted); border:1px solid var(--line);}
    .card.oos{opacity:.6;}
    .card.oos .add-btn{background:var(--line); cursor:not-allowed;}
    .fav-btn{
      position:absolute; top:10px; right:10px; width:30px; height:30px; border-radius:50%;
      background:#fff; border:none; display:flex; align-items:center; justify-content:center; z-index:2;
    }
    .fav-btn svg{width:15px; height:15px; stroke:var(--ink); fill:none; transition:.15s;}
    .fav-btn.active svg{fill:#e0554f; stroke:#e0554f;}
    .product-link{display:block;}
    .card-img{width:100%; height:120px; object-fit:contain; object-position:center; margin:12px 0 12px;}
    .card-brand{font-size:11px; color:var(--muted); font-weight:600; margin-bottom:2px;}
    .card-name{font-size:13px; font-weight:700; line-height:1.3; min-height:34px;}
    .card-bottom{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
    .card-price{font-size:14px; font-weight:800;}
    .stock-count{font-size:11px; color:var(--muted); font-weight:700; margin-top:8px;}
    .add-btn{
      width:32px; height:32px; border-radius:50%; background:var(--black); border:none;
      display:flex; align-items:center; justify-content:center; flex:0 0 auto;
    }
    .add-btn svg{width:14px; height:14px; stroke:#fff;}
    .add-btn.adding{animation:addPulse .45s ease;}
    .empty-state{
      padding:24px 18px; border:1px dashed var(--line); border-radius:var(--radius-md);
      background:var(--card); color:var(--muted); text-align:center; font-size:14px;
    }
    .fly-cart-img{
      position:fixed; z-index:120; width:76px; height:76px; object-fit:contain;
      pointer-events:none; border-radius:20px; background:var(--card); padding:9px;
      box-shadow:0 16px 34px rgba(20,20,20,.16);
      transition:transform .72s cubic-bezier(.2,.72,.2,1), opacity .72s ease;
    }

    .bottom-nav{
      position:fixed; bottom:0; left:0; right:0; z-index:60;
      background:#fff; border-top:1px solid var(--line);
      display:flex; align-items:center; justify-content:space-around;
      padding:12px 10px calc(12px + env(safe-area-inset-bottom));
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center; gap:5px;
      color:var(--muted); position:relative; background:none; border:none;
      text-decoration:none;
    }
    .nav-item svg{width:22px; height:22px; stroke:var(--muted); fill:none;}
    .nav-item.active{color:var(--ink);} .nav-item.active svg{stroke:var(--ink);}
    .nav-item.active::after{
      content:""; position:absolute; bottom:-9px; width:16px; height:2.5px; background:var(--ink); border-radius:2px;
    }
    .cart-badge{
      position:absolute; top:-6px; right:-8px; background:var(--black); color:#fff;
      font-size:9px; font-weight:700; width:15px; height:15px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
    }

    @keyframes addPulse{
      0%{transform:scale(1);} 45%{transform:scale(.96);} 100%{transform:scale(1);}
    }

    @media (min-width:600px) and (max-width:899px){
      .product-grid{grid-template-columns:repeat(3, minmax(0,1fr));}
    }
    @media (min-width:900px){
      body{padding-bottom:0;}
      .topnav{display:block;}
      .mobile-header{display:none;}
      .bottom-nav{display:none;}
      .page{padding:34px 0 54px;}
      .category-grid{grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px;}
      .category-card{min-height:180px; padding:22px 20px;}
      .product-grid{grid-template-columns:repeat(4,minmax(0,1fr)); gap:20px;}
      .card-img{height:150px;}
      .card-name{font-size:14px;}
    }
  </style>
</head>
<body>

  <script>
    const INVENTORY_KEY = 'oriflameInventory';
    const CART_KEY = 'oriflameCart';
    const CATEGORY_LIST = ['Skincare', 'Makeup', 'Fragrance', 'Hair', 'Bath & Body'];
    const FALLBACK_CATALOG = [

      {slug:'marshma-love-edt', brand:'Oriflame - MARSHMA-LOVE', name:'Eau de Toilette', cat:'Fragrance', price:'Rs. 1,259', image:'productImage (4).webp', stock:7, status:'Active', tag:null, description:'A fruity-floral scent that feels bright, youthful and easy to wear.', benefits:['Easy everyday wear','Radiant top notes','Clean, fresh finish'], usage:'Spritz lightly for a fresh daytime signature.'},
      {slug:'spring-song-hand-cream', brand:'Oriflame - Spring Song', name:'Hand Cream', cat:'Bath & Body', price:'Rs. 199', image:'productImage (5).webp', stock:18, status:'Active', tag:null, description:'A silky hand cream that comforts dry skin with a soft, nourishing finish.', benefits:['Moisturizes dry hands','Lightweight feel','Daily essential'], usage:'Massage into hands as needed throughout the day.'},
      {slug:'spring-song-shower-gel', brand:'Oriflame - Spring Song', name:'Shower Gel', cat:'Bath & Body', price:'Rs. 299', image:'productImage (6).webp', stock:14, status:'Active', tag:null, description:'A refreshing shower gel that cleanses and leaves skin feeling soft and lightly scented.', benefits:['Gentle cleanse','Soft skin feel','Fresh scent'], usage:'Apply to wet skin, rinse thoroughly and follow with body lotion.'},

      {slug:'eclat-mystique-edp', brand:'Oriflame - Eclat Mystique', name:'Eau de Parfum', cat:'Fragrance', price:'Rs. 1,899', image:'productImage.jpg', stock:6, status:'Active', tag:null, description:'A layered fragrance with floral elegance and a soft musky trail.', benefits:['Elegant profile','Long-lasting finish','Signature occasion scent'], usage:'Apply to wrists and behind ears for a refined, lasting impression.'},

      {slug:'the-one-lip-lacquer', brand:'Oriflame - The ONE', name:'Lip Lacquer', cat:'Makeup', price:'Rs. 549', image:'productImage (7).webp', stock:10, status:'Active', tag:null, description:'High-shine lip color with a smooth, cushiony finish and comfortable wear.', benefits:['Glossy finish','Soft texture','Everyday shade'], usage:'Swipe on directly for a plush glossy look.'},
      {slug:'the-one-eyeshadow-palette', brand:'Oriflame - The ONE', name:'Colour Stylist Eyeshadow Palette', cat:'Makeup', price:'Rs. 899', image:'productImage (7).webp', stock:6, status:'Active', tag:null, description:'A curated palette for easy everyday looks and soft evening definition.', benefits:['Blendable textures','Pigmented shades','Travel-ready compact'], usage:'Use the matte and shimmer tones together for a polished eye look.'},
      {slug:'the-one-wonder-lash-mascara', brand:'Oriflame - The ONE', name:'Wonder Lash Mascara', cat:'Makeup', price:'Rs. 699', image:'productImage (7).webp', stock:9, status:'Active', tag:null, description:'Curl, lengthen and intensify lashes with a smooth, buildable formula.', benefits:['Lifted look','Buildable volume','Easy everyday wear'], usage:'Sweep from root to tip for soft, lifted lashes.'},
      {slug:'milk-honey-shampoo', brand:'Oriflame - Milk & Honey Gold', name:'Nourishing Shampoo', cat:'Hair', price:'Rs. 399', image:'productImage (3).webp', stock:13, status:'Active', tag:null, description:'A gentle cleansing shampoo that supports soft, healthy-looking hair.', benefits:['Cleanses gently','Smooth feel','Nourishing finish'], usage:'Massage into wet hair and rinse thoroughly.'},

      {slug:'optimals-even-out-serum', brand:'Oriflame - Optimals', name:'Even Out Advanced Serum', cat:'Skincare', price:'Rs. 1,499', image:'productImage (1).webp', stock:7, status:'Active', tag:null, description:'A brightening serum that helps even out the complexion for a fresh look.', benefits:['Tone support','Glow-boosting','Daily radiance'], usage:'Massage 2-3 drops onto cleansed skin before moisturizer.'},
      {slug:'nature-secrets-argan-body-butter', brand:'Oriflame - Nature Secrets', name:'Argan Oil Body Butter', cat:'Bath & Body', price:'Rs. 579', image:'productImage (5).webp', stock:11, status:'Active', tag:null, description:'A rich body butter to soften and nourish skin with a velvety finish.', benefits:['Deep moisture','Silky finish','Comforting body care'], usage:'Apply to dry skin after showering for deeper hydration.'},
      {slug:'nature-secrets-coconut-body-wash', brand:'Oriflame - Nature Secrets', name:'Coconut Water Body Wash', cat:'Bath & Body', price:'Rs. 449', image:'productImage (6).webp', stock:12, status:'Active', tag:null, description:'A refreshing body wash that leaves skin clean, soft and lightly scented.', benefits:['Fresh cleanse','Soft skin feel','Body-care staple'], usage:'Lather on wet skin and rinse away thoroughly.'}
    ];

    function getInventoryCatalog(){
      try {
        const saved = JSON.parse(localStorage.getItem(INVENTORY_KEY));
        if (Array.isArray(saved) && saved.length) return saved;
      } catch {}
      localStorage.setItem(INVENTORY_KEY, JSON.stringify(FALLBACK_CATALOG));
      return FALLBACK_CATALOG;
    }
    function getCart(){
      try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
      catch { return []; }
    }
    function saveCart(cart){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
    function normalizeProduct(item){
      const stock = Number(item.stock || 0);
      const status = item.status || (stock <= 0 ? 'Out of stock' : 'Active');
      return {
        ...item,
        stock,
        brand:item.brand || 'Oriflame LK',
        name:item.name || 'Product',
        cat:item.cat || 'Skincare',
        price:item.price || 'Rs. 0',
        image:item.image || 'productImage.webp',
        tag: status === 'Out of stock' ? 'OUT OF STOCK' : item.tag || null,
        status
      };
    }

    const catalog = getInventoryCatalog().map(normalizeProduct).filter(item => item.status !== 'Hidden');

    function getSelectedCategory(){
      const params = new URLSearchParams(window.location.search);
      const cat = params.get('cat');
      return CATEGORY_LIST.includes(cat) ? cat : CATEGORY_LIST[0];
    }

    function getAvailableStock(slug){
      const item = catalog.find(p => p.slug === slug);
      return item ? Math.max(0, Number(item.stock || 0)) : 0;
    }

    function updateBagCount(){
      const count = getCart().reduce((sum, item) => sum + Number(item.qty || 0), 0);
      const mobile = document.getElementById('mobileBagCount');
      const desktop = document.getElementById('desktopBagCount');
      if (mobile) mobile.textContent = count;
      if (desktop) desktop.textContent = count;
    }

    function setCategory(cat){
      const url = new URL(window.location.href);
      url.searchParams.set('cat', cat);
      history.pushState({}, '', url);
      renderCategoryGrid(cat);
      renderSections(cat);
    }

    function renderCategoryGrid(activeCat){
      const html = CATEGORY_LIST.map(cat => {
        const count = catalog.filter(item => item.cat === cat).length;
        return `
          <button class="category-card ${activeCat === cat ? 'active' : ''}" data-cat="${cat}" type="button">
            <div class="label">Shop now</div>
            <div>
              <h3>${cat}</h3>
              <div class="meta">${count} products</div>
            </div>
          </button>
        `;
      }).join('');
      document.getElementById('categoryGrid').innerHTML = html;
    }

    function productCard(item){
      const unavailable = item.status === 'Out of stock' || getAvailableStock(item.slug) <= 0;
      const stockLabel = unavailable ? 'Out of stock' : getAvailableStock(item.slug) <= 3 ? `${getAvailableStock(item.slug)} left` : `${getAvailableStock(item.slug)} in stock`;
      return `
        <article class="card ${unavailable ? 'oos' : ''}">
          ${item.tag ? `<span class="badge-tag ${unavailable ? 'oos' : ''}">${item.tag}</span>` : ''}
          <button class="fav-btn" type="button" aria-label="Save to wishlist">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
          </button>
          <a class="product-link" href="product.html?item=${item.slug}" aria-label="View ${item.name}">
            <img class="card-img" src="${item.image}" alt="${item.name}">
            <div class="card-brand">${item.brand}</div>
            <div class="card-name">${item.name}</div>
          </a>
          <div class="stock-count">${stockLabel}</div>
          <div class="card-bottom">
            <div class="card-price">${item.price}</div>
            <button class="add-btn" type="button" data-slug="${item.slug}" aria-label="Add ${item.name} to bag" ${unavailable ? 'disabled' : ''}>
              <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </article>
      `;
    }

    function renderSections(activeCat){
      const cat = activeCat || CATEGORY_LIST[0];
      const items = catalog.filter(item => item.cat === cat);
      const sectionCards = items.length
        ? items.map(productCard).join('')
        : '<div class="empty-state">No products in this category yet — check back soon.</div>';

      document.getElementById('categorySections').innerHTML = `
        <section class="category-section">
          <div class="category-head">
            <h2>${cat}</h2>
            <span>${items.length} items</span>
          </div>
          <div class="product-grid">${sectionCards}</div>
        </section>
      `;
    }

    function addToCart(slug){
      const product = catalog.find(item => item.slug === slug);
      if (!product || getAvailableStock(slug) <= 0) return false;

      const cart = getCart();
      const existing = cart.find(item => item.slug === slug);
      if (existing) existing.qty = Math.min(99, Number(existing.qty || 0) + 1);
      else cart.push({ slug, qty: 1, addedAt: Date.now() });
      saveCart(cart);
      updateBagCount();
      return true;
    }

    document.body.addEventListener('click', (event) => {
      const card = event.target.closest('.category-card');
      if (card) {
        const cat = card.dataset.cat;
        setCategory(cat);
        return;
      }

      const addBtn = event.target.closest('.add-btn');
      if (addBtn && !addBtn.disabled) {
        const slug = addBtn.dataset.slug;
        const success = addToCart(slug);
        if (success) {
          addBtn.classList.remove('adding');
          void addBtn.offsetWidth;
          addBtn.classList.add('adding');
          const img = addBtn.closest('.card')?.querySelector('.card-img');
          const target = document.getElementById('mobileBagBtn') || document.getElementById('desktopBagBtn');
          if (img && target) {
            const from = img.getBoundingClientRect();
            const to = target.getBoundingClientRect();
            const ghost = img.cloneNode(true);
            ghost.className = 'fly-cart-img';
            ghost.style.left = `${from.left + from.width / 2 - 32}px`;
            ghost.style.top = `${from.top + from.height / 2 - 32}px`;
            document.body.appendChild(ghost);
            requestAnimationFrame(() => {
              ghost.style.transform = `translate(${to.left + to.width / 2 - from.left - from.width / 2}px, ${to.top + to.height / 2 - from.top - from.height / 2}px) scale(.35) rotate(10deg)`;
              ghost.style.opacity = '.15';
            });
            setTimeout(() => ghost.remove(), 760);
          }
        }
        return;
      }

      const favBtn = event.target.closest('.fav-btn');
      if (favBtn) {
        favBtn.classList.toggle('active');
      }
    });

    window.addEventListener('popstate', () => {
      const selected = getSelectedCategory();
      renderCategoryGrid(selected);
      renderSections(selected);
    });

    window.addEventListener('storage', (event) => {
      if (event.key === INVENTORY_KEY) {
        const selected = getSelectedCategory();
        renderCategoryGrid(selected);
        renderSections(selected);
      }
    });

    updateBagCount();
    const initial = getSelectedCategory();
    renderCategoryGrid(initial);
    renderSections(initial);
  </script>
</body>
</html>
